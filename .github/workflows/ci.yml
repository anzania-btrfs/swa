# Jina la utendaji
name: Majaribio

# Wakati wa kuendesha
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Kazi za kufanya
jobs:
  # Mnyororo wa Swa pekee — hauhitaji Rust, LLVM, wala clang.
  # Hii ndiyo lango kuu: hukagua mzizi wa uaminifu, fixpoint, na
  # programu zote za MANIFEST kwenye minyororo yote miwili.
  mnyororo:
    name: Mnyororo wa Swa
    runs-on: ubuntu-latest

    steps:
      - name: Pakua msimbo
        uses: actions/checkout@v4

      - name: Mnyororo wa kwanza (baiti za mkono)
        run: bash gharama/jenga-kwanza.sh

      - name: Mnyororo kamili wa majaribio
        run: bash gharama/jaribu-mnyororo.sh

  # Dereva wa Rust/LLVM — wa majaribio, si njia ya uzalishaji.
  dereva:
    name: Dereva wa Rust
    runs-on: ubuntu-latest

    steps:
      - name: Pakua msimbo
        uses: actions/checkout@v4

      - name: Weka Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Weka Clang na LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-18-dev
          echo "LLVM_CONFIG=llvm-config-18" >> $GITHUB_ENV

      - name: Jenga
        run: cargo build --release

      - name: Jaribu
        run: cargo test
